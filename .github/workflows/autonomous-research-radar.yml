name: autonomous-research-radar
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "research/autopilot/**"
      - ".github/workflows/autonomous-research-radar.yml"
  push:
    paths:
      - "research/autopilot/**"
      - ".github/workflows/autonomous-research-radar.yml"
  schedule:
    # 09:45 and 16:45 Eastern under both EST and EDT; unsuited UTC runs are skipped.
    - cron: "45 13,14,20,21 * * 1-5"
permissions:
  contents: read
  actions: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Test all three independent research layers
        run: |
          python -m unittest discover -s research/autopilot -p 'test_*.py' -v
          python -m unittest discover -s research/long_horizon -p 'test_*.py' -v
          python -m unittest discover -s research/two_clock -p 'test_*.py' -v
  research:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/feature/autopilot-research-radar-20261110'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EDGAR_CONTACT: ${{ secrets.EDGAR_CONTACT }}
      PRICE_PROVIDER_ORDER: stooq,yahoo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Only scan at local Eastern market milestones
        id: timegate
        env:
          GH_EVENT: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import datetime,os
          from zoneinfo import ZoneInfo
          now=datetime.datetime.now(ZoneInfo("America/New_York"))
          fire=os.getenv("GH_EVENT") in ("workflow_dispatch","push") or (now.weekday()<5 and now.hour in (9,16))
          with open(os.environ["GITHUB_OUTPUT"],"a") as output:
              output.write("fire="+("true" if fire else "false")+"\n")
          print("Eastern",now.isoformat(),"scan",fire)
          PY
      - name: Restore previous immutable SEC evidence ledger
        if: steps.timegate.outputs.fire == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p prior
          ids=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow autonomous-research-radar.yml --limit 20 --json databaseId --jq '.[].databaseId' 2>/dev/null || true)
          for id in $ids; do
            mkdir -p prior/one
            if gh run download "$id" --repo "$GITHUB_REPOSITORY" --dir prior/one --pattern 'quiet-money-research-*' >/dev/null 2>&1; then
              found=$(find prior/one -name event_ledger.json -type f | head -n 1)
              if [ -n "$found" ]; then
                cp "$found" previous_ledger.json
                break
              fi
            fi
            rm -rf prior/one
          done
          if [ -f previous_ledger.json ]; then
            echo "Prior SEC first-seen evidence restored." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No prior evidence artifact; starting a new research lineage." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: SEC and price research scan (never trades)
        if: steps.timegate.outputs.fire == 'true'
        run: python -m research.autopilot.run --output-dir autopilot_output --max-symbols 8 --max-sec-reviews 3 --previous-ledger previous_ledger.json
      - name: Display complete researched stock list in Actions Summary
        if: always() && steps.timegate.outputs.fire == 'true'
        run: |
          if [ -f autopilot_output/research_scan.md ]; then
            cat autopilot_output/research_scan.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Research scan produced no artifact; inspect failed step." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Save complete scanned universe and evaluations
        if: always() && steps.timegate.outputs.fire == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: quiet-money-research-${{ github.run_id }}
          path: autopilot_output/
          retention-days: 30
          if-no-files-found: warn
