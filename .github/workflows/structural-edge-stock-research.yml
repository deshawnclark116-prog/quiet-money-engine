name: structural-edge-stock-research
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "research/autopilot/structural_lab.py"
      - "research/autopilot/test_structural_lab.py"
      - ".github/workflows/structural-edge-stock-research.yml"
  push:
    paths:
      - "research/autopilot/structural_lab.py"
      - "research/autopilot/test_structural_lab.py"
      - ".github/workflows/structural-edge-stock-research.yml"

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run causal event and replay validation
        run: |
          python -m unittest discover -s research/autopilot -p 'test_structural_lab.py' -v
          python -m unittest discover -s research/autopilot -p 'test_entry_audit.py' -v
          python -m unittest discover -s research/autopilot -p 'test_price_basis.py' -v

  hypothesis-shootout:
    needs: contracts
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PRICE_PROVIDER_ORDER: stooq,yahoo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Test frozen structural hypotheses against incumbent and placebo
        run: |
          python -m research.autopilot.structural_lab --days 1000 --output-dir structural_research_output
      - name: Show all results including losing models
        if: always()
        run: |
          if [ -f structural_research_output/structural_summary.md ]; then
            cat structural_research_output/structural_summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Lab did not return adequate data; do not promote any model." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: structural-edge-shootout-${{ github.run_id }}
          path: structural_research_output/
          retention-days: 30
          if-no-files-found: warn
